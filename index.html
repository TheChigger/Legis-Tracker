<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignore WebSocket disconnection errors in iframe sandbox
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          String(event.reason.message || event.reason).includes('WebSocket') ||
          String(event.reason.stack || '').includes('@vite/client')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (String(event.message || '').includes('WebSocket') || String(event.filename || '').includes('@vite/client')) {
          event.preventDefault();
        }
      });
    </script>
    <title>Texas Capitol Legislative Intelligence & Policy Engine</title>
    <meta name="description" content="Interactive Texas Legislature tracker and AI policy analysis engine. Features daily priority bill scoring, comport/conflict analysis, lawmaker profiling, multi-version bill deep dives, committee minutes, and automated legislative pipeline scripts." />
    <meta property="og:title" content="Texas Capitol Legislative Intelligence & Policy Engine" />
    <meta property="og:description" content="Interactive Texas Legislature tracker and AI policy analysis engine. Features daily priority bill scoring, comport/conflict analysis, lawmaker profiling, multi-version bill deep dives, committee minutes, and automated legislative pipeline scripts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>

</html>
